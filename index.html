<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CYBER DEFENSE TERMINAL v4.0</title>
    <style>
        body {
            background-color: #050505;
            color: #00ff66;
            font-family: 'Courier New', Courier, monospace;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
            overflow: hidden;
        }
        .terminal-box {
            width: 90%;
            max-width: 700px;
            background-color: rgba(10, 15, 10, 0.9);
            border: 2px solid #00ff66;
            box-shadow: 0 0 20px rgba(0, 255, 102, 0.3);
            border-radius: 8px;
            padding: 20px;
            box-sizing: border-box;
        }
        .header {
            border-bottom: 1px solid #00ff66;
            padding-bottom: 10px;
            margin-bottom: 20px;
            display: flex;
            justify-content: space-between;
            font-weight: bold;
            font-size: 1.1rem;
        }
        .output-screen {
            height: 300px;
            overflow-y: auto;
            margin-bottom: 20px;
            padding: 10px;
            background-color: #000;
            border-radius: 4px;
            border: 1px solid rgba(0, 255, 102, 0.3);
        }
        .line {
            margin-bottom: 8px;
            line-height: 1.4;
            opacity: 0;
            animation: fadeIn 0.3s forwards;
        }
        @keyframes fadeIn {
            to { opacity: 1; }
        }
        .accent { color: #58a6ff; }
        .danger { color: #ff3333; }
        .warning { color: #ffcc00; }
        
        .btn-panel {
            display: flex;
            gap: 15px;
        }
        .action-btn {
            flex: 1;
            background-color: transparent;
            color: #00ff66;
            border: 1px solid #00ff66;
            padding: 12px;
            font-family: 'Courier New', Courier, monospace;
            font-size: 1rem;
            font-weight: bold;
            cursor: pointer;
            border-radius: 4px;
            text-transform: uppercase;
            transition: all 0.2s ease;
        }
        .action-btn:hover {
            background-color: #00ff66;
            color: #000;
            box-shadow: 0 0 15px rgba(0, 255, 102, 0.6);
        }
        .action-btn:disabled {
            border-color: #333;
            color: #333;
            cursor: not-allowed;
            box-shadow: none;
        }
    </style>
</head>
<body>

    <div class="terminal-box">
        <div class="header">
            <span>⚡ CORE_SYSTEM_v4.0</span>
            <<span>STATUS: ONLINE</span>
        </div>

        <div class="output-screen" id="terminal-output">
            <div class="line">[INFO] System initialized successfully.</div>
            <div class="line">[INFO] Ready for security scan simulation...</div>
        </div>

        <div class="btn-panel">
            <button class="action-btn" id="scan-btn" onclick="startScan()">Run Core Scan</button>
            <button class="action-btn danger" id="bypass-btn" onclick="startBypass()" style="border-color: #ff3333; color: #ff3333;">Bypass Firewall</button>
        </div>
    </div>

    <script>
        const output = document.getElementById('terminal-output');
        const scanBtn = document.getElementById('scan-btn');
        const bypassBtn = document.getElementById('bypass-btn');

        function printLine(text, type = '') {
            const line = document.createElement('div');
            line.className = `line ${type}`;
            line.innerHTML = text;
            output.appendChild(line);
            output.scrollTop = output.scrollHeight;
        }

        function disableButtons(status) {
            scanBtn.disabled = status;
            bypassBtn.disabled = status;
        }

        // Voice Output (No API key needed, uses built-in browser voice)
        function speak(text) {
            window.speechSynthesis.cancel();
            const speech = new SpeechSynthesisUtterance(text);
            speech.lang = 'en-US';
            window.speechSynthesis.speak(speech);
        }

        function startScan() {
            disableButtons(true);
            output.innerHTML = '';
            speak("Initiating system core diagnostics.");
            
            let steps = [
                { text: "⏳ Initializing Global Network Scanner...", delay: 0 },
                { text: "🛰️ Connecting to localized secure nodes...", delay: 800 },
                { text: "<span class='accent'>[OK] Connection established with Mainframe.</span>", delay: 1500 },
                { text: "🔍 Scanning internal database structures...", delay: 2200 },
                { text: "⚠️ <span class='warning'>WARNING: Minor memory leak detected in Sector 7.</span>", delay: 3000 },
                { text: "🛡️ Deploying security patches...", delay: 3800 },
                { text: "🟩 <span class='accent'>[SUCCESS] System integrity verified. 100% Secure.</span>", delay: 4600 }
            ];

            steps.forEach(step => {
                setTimeout(() => {
                    printLine(step.text);
                    if(step.text.includes('SUCCESS')) {
                        speak("Scan complete. System secured.");
                        disableButtons(false);
                    }
                }, step.delay);
            });
        }

        function startBypass() {
            disableButtons(true);
            output.innerHTML = '';
            speak("Warning. Attempting to bypass firewall encryption.");

            let steps = [
                { text: "<span class='danger'>[ALERT] Overriding local firewall protocols...</span>", delay: 0 },
                { text: "📡 Injecting packet strings into gateway...", delay: 700 },
                { text: "🔑 Decrypting security handshake tokens...", delay: 1400 },
                { text: "🧬 Cracking 256-bit AES encryption keys...", delay: 2100 },
                { text: "💥 <span class='danger'>[CRITICAL] Firewalls offline! Accessing Core...</span>", delay: 2900 },
                { text: "👑 <span class='accent'>ACCESS GRANTED. Welcome back, Admin.</span>", delay: 3800 }
            ];

            steps.forEach(step => {
                setTimeout(() => {
                    printLine(step.text);
                    if(step.text.includes('GRANTED')) {
                        speak("Access granted. Mainframe decrypted.");
                        disableButtons(false);
                    }
                }, step.delay);
            });
        }
    </script>
</body>
</html>
